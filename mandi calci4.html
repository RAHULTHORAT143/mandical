<script>
    // ⚠️ REPLACE THIS STRING WITH YOUR REDEPLOYED WEB APP EXECUTION LINK

    let cachedRecords = [];

    function calculate() {
        const p = parseFloat(document.getElementById('price').value) || 0;
        const q = parseFloat(document.getElementById('qty').value) || 0;
        const ghatCal = parseFloat(document.getElementById('ghat').value) || 0;
        const hamaliCal = parseFloat(document.getElementById('hamali').value) || 0;
        const vahatukCal = parseFloat(document.getElementById('vahatuk').value) || 0;
        const advancePayCal = parseFloat(document.getElementById('advancePaymnet').value) || 0;

        const totalDetails = p * (q - ((q / 100) * ghatCal));
        const hamaliDetails = hamaliCal * (q / 100);
        const vahatukDetails = vahatukCal;
		
        const total = totalDetails - (hamaliDetails + vahatukDetails + advancePayCal);
		
        document.getElementById('total-display').innerText = `₹${total.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        return total;
    }

    // switch page and load data logic 

    function switchPage(pageName) {
        document.getElementById('formPage').classList.remove('active-page');
        document.getElementById('recordsPage').classList.remove('active-page');
        document.getElementById('navForm').classList.remove('active');
        document.getElementById('navRecords').classList.remove('active');

        if (pageName === 'form') {
            document.getElementById('formPage').classList.add('active-page');
            document.getElementById('navForm').classList.add('active');
        } else if (pageName === 'records') {
            document.getElementById('recordsPage').classList.add('active-page');
            document.getElementById('navRecords').classList.add('active');
            loadTableData(); // Automatically fetch the latest data from the sheet when switching views
        }
    }

    // Master API Communication Bridge
    async function executeApi(payload) {
        try {
            const response = await fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            return await response.json();
        } catch(e) {
            console.error("Transmission breakdown: ", e);
            alert("⚠️ API network request failed.");
        }
    }

    // CREATE ACTION
    async function handleSave() {
        const payload = collectFormData();
        if(!payload.farmerName || !payload.price || !payload.qty) {
            alert("⚠️ Farmer Name, Price, and Weight are explicitly required!");
            return;
        }
        
        payload.action = "create";
        payload.id = "id_" + new Date().getTime(); // Build safe primary key token

        const res = await executeApi(payload);
        if(res && res.status === "success") {
            alert(res.message);
            clearForm();
            loadTableData();
        }
    }

    // READ ACTION
    async function loadTableData() {
        const viewEl = document.getElementById('recordsContainer');
        viewEl.innerHTML = `<p style="text-align: center; color: #777;">Fetching database entries...</p>`;
        
        const res = await executeApi({ action: "read" });
        if(res && res.status === "success") {
            cachedRecords = res.data;
            renderMobileCards(res.data);
        }
    }

    // Build cleaner Mobile-Friendly UI cards instead of squished tables
    function renderMobileCards(records) {
        const container = document.getElementById('recordsContainer');
        if(!records || records.length === 0) {
            container.innerHTML = `<p style="text-align: center; color: #777;">No transaction history found.</p>`;
            return;
        }

        container.innerHTML = records.map(row => `
            <div class="record-card">
                <div class="record-title">${row.farmerName}</div>
                <div class="record-meta">🌾 ${row.item.toUpperCase()} | Qty: ${row.qty} KG | Rate: ₹${row.price}</div>
                <div class="record-total">Total Pay: ₹${parseFloat(row.total).toLocaleString('en-IN', {maximumFractionDigits:2})}</div>
                <div class="card-actions">
                    <button class="btn-edit" onclick="initiateEdit('${row.id}')">Edit</button>
                    <button class="btn-delete" onclick="handleDelete('${row.id}')">Delete</button>
                </div>
            </div>
        `).join('');
    }

    // INITIALIZE EDIT ROUTER
    function initiateEdit(id) {
        const target = cachedRecords.find(r => r.id === id);
        if(!target) return;

        // Map cached record data fields accurately into the UI input fields
        document.getElementById('currentId').value = target.id;
        document.getElementById('farmerName').value = target.farmerName;
        document.getElementById('Commodity').value = target.item;
        document.getElementById('price').value = target.price;
        document.getElementById('qty').value = target.qty;
        document.getElementById('ghat').value = target.ghat;
        document.getElementById('hamali').value = target.hamali;
        document.getElementById('vahatuk').value = target.vahatuk;
        document.getElementById('advancePaymnet').value = target.advancePayment;

        calculate(); // Force recalculation update across visual boards

        // Swap out form button interfaces smoothly
        document.getElementById('submitBtn').style.display = "none";
        document.getElementById('updateContainer').style.display = "flex";
        window.scrollTo({ top: 0, behavior: 'smooth' }); // Scroll back up to edit form
    }

    // UPDATE ACTION
    async function handleUpdate() {
        const payload = collectFormData();
        payload.action = "update";
        payload.id = document.getElementById('currentId').value;

        const res = await executeApi(payload);
        if(res && res.status === "success") {
            alert(res.message);
            cancelEdit();
            loadTableData();
        }
    }

    // DELETE ACTION
    async function handleDelete(id) {
        if(!confirm("Are you absolutely sure you want to permanently delete this billing file?")) return;
        
        const res = await executeApi({ action: "delete", id: id });
        if(res && res.status === "success") {
            alert(res.message);
            loadTableData();
        }
    }

    function collectFormData() {
        return {
            farmerName: document.getElementById('farmerName').value.trim(),
            item: document.getElementById('Commodity').value,
            price: parseFloat(document.getElementById('price').value) || 0,
            qty: parseFloat(document.getElementById('qty').value) || 0,
            ghat: parseFloat(document.getElementById('ghat').value) || 0,
            hamali: parseFloat(document.getElementById('hamali').value) || 0,
            vahatuk: parseFloat(document.getElementById('vahatuk').value) || 0,
            advancePayment: parseFloat(document.getElementById('advancePaymnet').value) || 0,
            total: calculate()
        };
    }

    function cancelEdit() {
        clearForm();
        document.getElementById('submitBtn').style.display = "block";
        document.getElementById('updateContainer').style.display = "none";
    }

    function clearForm() {
        document.getElementById('currentId').value = "";
        document.getElementById('farmerName').value = "";
        document.getElementById('price').value = "";
        document.getElementById('qty').value = "";
        document.getElementById('ghat').value = "";
        document.getElementById('hamali').value = "";
        document.getElementById('vahatuk').value = "";
        document.getElementById('advancePaymnet').value = "";
        document.getElementById('total-display').innerText = "₹0.00";
    }

        const ghat = document.getElementById('ghat').value || 0;
        const hamali = document.getElementById('hamali').value || 0;

        if(!price || !qty) {
            alert("Please enter Price and Weight first!");
            return;
        }

        doc.setFontSize(22);
        doc.setTextColor(46, 125, 50);

            document.getElementById('recordsPage').classList.add('active-page');
            document.getElementById('navRecords').classList.add('active');
            loadTableData(); // Automatically fetch the latest data from the sheet when switching views
        }
    }

    function calculate() {
        const p = parseFloat(document.getElementById('price').value) || 0;
        const q = parseFloat(document.getElementById('qty').value) || 0;
        const ghatCal = parseFloat(document.getElementById('ghat').value) || 0;
        const hamaliCal = parseFloat(document.getElementById('hamali').value) || 0;
        const vahatukCal = parseFloat(document.getElementById('vahatuk').value) || 0;
        const advancePayCal = parseFloat(document.getElementById('advancePaymnet').value) || 0;

        const totalDetails = p * (q - ((q / 100) * ghatCal));
        const hamaliDetails = hamaliCal * (q / 100);
        const vahatukDetails = vahatukCal;
        
        const total = totalDetails - (hamaliDetails + vahatukDetails + advancePayCal);
        
        document.getElementById('total-display').innerText = `₹${total.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        return total;
    }

    async function executeApi(payload) {
        try {
            const response = await fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) });
            return await response.json();
        } catch(e) {
            console.error(e);
            alert("⚠️ API network communication failure.");
        }
    }

    // CREATE ACTION
    async function handleSave() {
        const payload = collectFormData();
        if(!payload.farmerName || !payload.price || !payload.qty) {
            alert("⚠️ Farmer Name, Price, and Weight are required fields!");
            return;
        }
        
        payload.action = "create";
        payload.id = "id_" + new Date().getTime();

        const res = await executeApi(payload);
        if(res && res.status === "success") {
            alert(res.message);
            clearForm();
            switchPage('records'); // Take user to directory directly to view the entry
        }
    }

    // READ ACTION
    async function loadTableData() {
        const viewEl = document.getElementById('recordsContainer');
        viewEl.innerHTML = `<p style="text-align: center; color: #777;">Fetching database entries...</p>`;
        
        const res = await executeApi({ action: "read" });
        if(res && res.status === "success") {
            cachedRecords = res.data;
            renderMobileCards(res.data);
        }
    }

    function renderMobileCards(records) {
        const container = document.getElementById('recordsContainer');
        if(!records || records.length === 0) {
            container.innerHTML = `<p style="text-align: center; color: #777;">No history records found.</p>`;
            return;
        }

        container.innerHTML = records.map(row => `
            <div class="record-card">
                <div class="record-title" onclick="initiateEdit('${row.id}')">${row.farmerName} 📝</div>
                <div class="record-meta" onclick="initiateEdit('${row.id}')">🌾 ${row.item.toUpperCase()} | Qty: ${row.qty} KG | Rate: ₹${row.price}</div>
                <div class="record-total" onclick="initiateEdit('${row.id}')">Total Pay: ₹${parseFloat(row.total).toLocaleString('en-IN', {maximumFractionDigits:2})}</div>
                
            </div>
        `).join('');
    }

    // MAP CHOSEN ENTRY DATA VALUES BACK INTO INPUT INTERFACES
    function initiateEdit(id) {
        const target = cachedRecords.find(r => r.id === id);
        if(!target) return;

        document.getElementById('currentId').value = target.id;
        document.getElementById('farmerName').value = target.farmerName;
        document.getElementById('Commodity').value = target.item;
        document.getElementById('price').value = target.price;
        document.getElementById('qty').value = target.qty;
        document.getElementById('ghat').value = target.ghat;
        document.getElementById('hamali').value = target.hamali;
        document.getElementById('vahatuk').value = target.vahatuk;
        document.getElementById('advancePaymnet').value = target.advancePayment;

        calculate(); 

        // Adjust form page header to show we are in edit mode
        document.getElementById('formHeader').innerText = "Modify Record 📝";
        document.getElementById('submitBtn').style.display = "none";
        document.getElementById('updateContainer').style.display = "flex";
        
        // Take them automatically back to the input form page view
        switchPage('form');
    }

    // UPDATE ACTION
    async function handleUpdate() {
        const payload = collectFormData();
        payload.action = "update";
        payload.id = document.getElementById('currentId').value;

        const res = await executeApi(payload);
        if(res && res.status === "success") {
            alert(res.message);
            cancelEdit();
            switchPage('records');
        }
    }

    // DELETE ACTION
    async function handleDelete(event, id) {
        event.stopPropagation(); // Stops the card click event (edit handler) from firing
        if(!confirm("Are you sure you want to permanently delete this billing file?")) return;
        
        const res = await executeApi({ action: "delete", id: id });
        if(res && res.status === "success") {
            alert(res.message);
            loadTableData();
        }
    }

    function collectFormData() {
        return {
            farmerName: document.getElementById('farmerName').value.trim(),
            item: document.getElementById('Commodity').value,
            price: parseFloat(document.getElementById('price').value) || 0,
            qty: parseFloat(document.getElementById('qty').value) || 0,
            ghat: parseFloat(document.getElementById('ghat').value) || 0,
            hamali: parseFloat(document.getElementById('hamali').value) || 0,
            vahatuk: parseFloat(document.getElementById('vahatuk').value) || 0,
            advancePayment: parseFloat(document.getElementById('advancePaymnet').value) || 0,
            total: calculate()
        };
    }

    function cancelEdit() {
        clearForm();
        document.getElementById('formHeader').innerText = "New Bill 🌾";
        document.getElementById('submitBtn').style.display = "block";
        document.getElementById('updateContainer').style.display = "none";
    }

    function clearForm() {
        document.getElementById('currentId').value = "";
        document.getElementById('farmerName').value = "";
        document.getElementById('price').value = "";
        document.getElementById('qty').value = "";
        document.getElementById('ghat').value = "";
        document.getElementById('hamali').value = "";
        document.getElementById('vahatuk').value = "";
        document.getElementById('advancePaymnet').value = "";
        document.getElementById('total-display').innerText = "₹0.00";
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        const name = document.getElementById('farmerName').value || "Guest Farmer";
        const item = document.getElementById('Commodity').value;
        const price = document.getElementById('price').value;
        const qty = document.getElementById('qty').value;
        const ghat = document.getElementById('ghat').value || 0;
        const hamali = document.getElementById('hamali').value || 0;
        const vahatuk = document.getElementById('vahatuk').value || 0;
        const advancePaymnet = document.getElementById('advancePaymnet').value || 0;

        if(!price || !qty) {
            alert("Please enter Price and Weight first!");
            return;
        }

        doc.setFontSize(22);
        doc.setTextColor(46, 125, 50); 
        doc.text("TRIKAL-TRADE RECEIPT", 105, 20, { align: "center" });
        
        doc.setFontSize(10);
        doc.setTextColor(100);
        doc.text(`Date: ${new Date().toLocaleDateString()} | Time: ${new Date().toLocaleTimeString()}`, 105, 28, { align: "center" });

        doc.setDrawColor(200);
        doc.line(20, 35, 190, 35);
        doc.setFontSize(12);
        doc.setTextColor(0);
        doc.text(`Farmer Name: ${name}`, 20, 45);
        doc.text(`Commodity: ${item.toUpperCase()}`, 20, 52);

        doc.autoTable({
            startY: 60,
            head: [['Description', 'Value']],
            body: [
                ['Rate (per KG)', `Rs. ${price}`],
                ['Total Weight', `${qty} KG`],
                ['Ghat (Deduction)', `${ghat}%`],
                ['Hamali (per Quintal)', `Rs. ${hamali}`],
                ['Vahatuk (Transport)', `Rs. ${vahatuk}`],
                ['Advance Payment', `Rs. ${advancePaymnet}`]
            ],
            theme: 'striped',
            headStyles: { fillColor: [46, 125, 50] }
        });

        const finalY = doc.lastAutoTable.finalY + 15;
        doc.setFillColor(232, 245, 233); 
        doc.rect(20, finalY, 170, 20, 'F');

        const rawTotal = calculate(); 
        const formattedNumber = rawTotal.toLocaleString('en-IN', {
            maximumFractionDigits: 2,
            minimumFractionDigits: 2
        });

        const totalString = "GRAND TOTAL: Rs. " + formattedNumber;

        doc.setFont("helvetica", "bold");
        doc.setFontSize(15);
        doc.setTextColor(46, 125, 50);
        doc.text(totalString, 105, finalY + 13, { align: "center", charSpace: 0 });

        const pageHeight = doc.internal.pageSize.height || doc.internal.pageSize.getHeight();
        doc.setFontSize(9);
        doc.setFont("helvetica", "normal");
        doc.setTextColor(150);
        doc.text("Thank you for your business! This is a digital copy.", 105, pageHeight - 20, { align: "center" });

        doc.save(`Bill_${name}_${item}.pdf`);
    }

    // Auto-load on setup mount
    window.onload = function() {
        calculate();
    };
</script>
</body>
</html>
